<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月度数据统计 - 事件记录器</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>月度记录数据统计</h1>
      <a href="../index.html" class="back-link">← 返回主页</a>
    </div>
    
    <div class="filter-container">
      <label for="year-filter">选择年份：</label>
      <select id="year-filter" class="year-select">
        <!-- 年份选项将通过JS动态生成 -->
      </select>
    </div>
    
    <div class="month-stats-container">
      <div class="chart-container">
        <div id="monthly-chart" style="height: 500px;"></div>
      </div>
      <div class="month-summary">
        <div class="summary-item">
          <span class="summary-label">总记录数：</span>
          <span class="summary-value" id="total-month-records">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">最高记录月份：</span>
          <span class="summary-value" id="max-month">--</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">平均每月记录：</span>
          <span class="summary-value" id="avg-month-records">0</span>
        </div>
        
        <!-- 时间段统计 -->
        <div class="time-periods-container">
          <div class="time-periods-grid">
            <div class="time-period-item">
              <div class="period-label">上午<br>6:00-12:00</div>
              <div class="period-value" id="morning-count">0</div>
            </div>
            <div class="time-period-item">
              <div class="period-label">下午<br>12:00-18:00</div>
              <div class="period-value" id="afternoon-count">0</div>
            </div>
            <div class="time-period-item">
              <div class="period-label">夜晚<br>18:00-24:00</div>
              <div class="period-value" id="night-count">0</div>
            </div>
            <div class="time-period-item">
              <div class="period-label">凌晨<br>0:00-6:00</div>
              <div class="period-value" id="dawn-count">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 月度数据统计功能
    (function() {
      let currentYear = new Date().getFullYear();
      let allRecords = [];

      // 获取所有记录数据
      function getAllRecordData() {
        try {
          const records = JSON.parse(localStorage.getItem('timeRecords')) || [];
          return records.filter(record => 
            record.time && record.timestamp && typeof record.timestamp === 'number'
          );
        } catch (error) {
          console.error('读取记录数据失败:', error);
          return [];
        }
      }

      // 生成年份选项
      function generateYearOptions() {
        const yearSelect = document.getElementById('year-filter');
        if (!yearSelect) return;

        // 提取所有不重复的年份
        const yearSet = new Set();
        allRecords.forEach(record => {
          const recordDate = new Date(record.timestamp);
          yearSet.add(recordDate.getFullYear());
        });

        const yearList = Array.from(yearSet).sort((a, b) => b - a); // 倒序排列

        if (yearList.length === 0) {
          yearSelect.innerHTML = '<option value="">暂无数据</option>';
          yearSelect.disabled = true;
          return;
        }

        // 生成选项
        yearSelect.innerHTML = yearList.map(year => 
          `<option value="${year}" ${year === currentYear ? 'selected' : ''}>${year}年</option>`
        ).join('');

        // 如果当前年份没有数据，选择第一个有数据的年份
        if (!yearList.includes(currentYear)) {
          currentYear = yearList[0];
          yearSelect.value = currentYear;
        }

        // 监听年份变化
        yearSelect.addEventListener('change', function() {
          currentYear = Number(this.value);
          renderAllData();
        });
      }

      // 计算月度数据
      function calculateMonthlyData(records, year) {
        const monthMap = Array(12).fill(0);
        let totalRecords = 0;
        const timePeriods = {
          morning: 0,
          afternoon: 0,
          night: 0,
          dawn: 0
        };

        records.forEach(record => {
          const recordDate = new Date(record.timestamp);
          if (recordDate.getFullYear() === year) {
            const month = recordDate.getMonth(); // 0-11
            const hour = recordDate.getHours();
            
            monthMap[month]++;
            totalRecords++;
            
            // 统计时间段
            if (hour >= 6 && hour < 12) {
              timePeriods.morning++;
            } else if (hour >= 12 && hour < 18) {
              timePeriods.afternoon++;
            } else if (hour >= 18 && hour < 24) {
              timePeriods.night++;
            } else {
              timePeriods.dawn++;
            }
          }
        });

        // 找出最大值
        const maxMonthIndex = monthMap.indexOf(Math.max(...monthMap));
        const maxMonth = maxMonthIndex !== -1 ? { month: maxMonthIndex + 1, count: monthMap[maxMonthIndex] } : null;

        return {
          monthData: monthMap,
          totalRecords: totalRecords,
          maxMonth: maxMonth,
          timePeriods: timePeriods
        };
      }

      // 渲染月度图表
      function renderMonthlyChart(monthData) {
        const chartDom = document.getElementById('monthly-chart');
        if (!chartDom) return;

        const myChart = echarts.init(chartDom);

        const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

        const option = {
          title: {
            text: `${currentYear}年月度记录数量统计`,
            left: 'center'
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            },
            formatter: function(params) {
              const data = params[0];
              return `${data.name}<br/>记录数：${data.value} 次`;
            }
          },
          grid: {
            left: '3%',
            right: '4%',
            bottom: '3%',
            containLabel: true
          },
          xAxis: {
            type: 'category',
            data: months,
            axisLabel: {
              interval: 0
            }
          },
          yAxis: {
            type: 'value',
            minInterval: 1,
            name: '记录数'
          },
          series: [
            {
              name: '记录数',
              type: 'bar',
              data: monthData,
              itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                  { offset: 0, color: '#667eea' },
                  { offset: 1, color: '#764ba2' }
                ])
              },
              emphasis: {
                itemStyle: {
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#5a6fd8' },
                    { offset: 1, color: '#6a4190' }
                  ])
                }
              },
              label: {
                show: true,
                position: 'top',
                formatter: '{c} 次'
              }
            }
          ]
        };

        myChart.setOption(option);

        // 响应式调整
        window.addEventListener('resize', () => {
          myChart.resize();
        });

        // 延迟触发resize确保图表正确显示
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 100);
      }

      // 更新统计摘要
      function updateSummary(monthlyStats) {
        document.getElementById('total-month-records').textContent = monthlyStats.totalRecords;
        
        if (monthlyStats.maxMonth) {
          document.getElementById('max-month').textContent = 
            `${monthlyStats.maxMonth.month}月（${monthlyStats.maxMonth.count} 次）`;
        } else {
          document.getElementById('max-month').textContent = '--';
        }

        const avgRecords = monthlyStats.totalRecords > 0 ? 
          Math.round(monthlyStats.totalRecords / 12) : 0;
        document.getElementById('avg-month-records').textContent = avgRecords + ' 次';
      }

      // 更新时间段统计
      function updateTimePeriods(timePeriods) {
        document.getElementById('morning-count').textContent = timePeriods.morning || 0;
        document.getElementById('afternoon-count').textContent = timePeriods.afternoon || 0;
        document.getElementById('night-count').textContent = timePeriods.night || 0;
        document.getElementById('dawn-count').textContent = timePeriods.dawn || 0;
      }

      // 渲染所有数据
      function renderAllData() {
        const monthlyStats = calculateMonthlyData(allRecords, currentYear);
        
        if (monthlyStats.totalRecords === 0) {
          document.getElementById('monthly-chart').innerHTML = 
            `<div style="text-align: center; padding: 100px; color: #666;">${currentYear}年暂无数据</div>`;
          
          document.getElementById('total-month-records').textContent = '0';
          document.getElementById('max-month').textContent = '--';
          document.getElementById('avg-month-records').textContent = '0 次';
          
          return;
        }

        renderMonthlyChart(monthlyStats.monthData);
        updateSummary(monthlyStats);
        updateTimePeriods(monthlyStats.timePeriods);
      }

      // 初始化页面
      function init() {
        allRecords = getAllRecordData();
        generateYearOptions();
        renderAllData();
      }

      // 页面加载完成后初始化
      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
