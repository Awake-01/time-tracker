<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>年度时间记录报告</title>
  <!-- 引入原有样式（保证风格统一）+ ECharts（图表依赖） -->
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>
  <div class="annual-report">
    <h1>2024年度时间记录报告</h1>
    
    <!-- 报告分页标签 -->
    <div class="report-tabs">
      <div class="report-tab active" data-tab="monthly-stat">月度数据统计</div>
      <div class="report-tab" data-tab="max-record">最多记录时段</div>
      <div class="report-tab" data-tab="time-node">最早/最晚记录</div>
    </div>

    <!-- 1. 月度数据统计面板 -->
    <div class="report-content active" id="monthly-stat">
      <div class="chart-box" id="monthly-chart"></div>
      <div class="data-card">
        <h3>2024年度数据汇总</h3>
        <div class="data-item">年度总记录数：<span id="total-count">0</span> 次</div>
        <h3>各月度记录数</h3>
        <div id="monthly-data-list" class="data-item"></div>
      </div>
    </div>

    <!-- 2. 最多记录时段面板 -->
    <div class="report-content" id="max-record">
      <div class="data-card">
        <h3>记录数最多的时段</h3>
        <div class="data-item">最多记录月份：<span id="max-month">--</span>（<span id="max-month-count">0</span> 次）</div>
        <div class="data-item">最多记录周：<span id="max-week">--</span>（<span id="max-week-count">0</span> 次）</div>
        <div class="data-item">最多记录日：<span id="max-day">--</span>（<span id="max-day-count">0</span> 次）</div>
      </div>
    </div>

    <!-- 3. 最早/最晚记录面板 -->
    <div class="report-content" id="time-node">
      <div class="data-card">
        <h3>极端时间记录</h3>
        <div class="data-item">最早记录：<span id="earliest-time">--</span>（<span id="earliest-date">--</span>）</div>
        <div class="data-item">最晚记录：<span id="latest-time">--</span>（<span id="latest-date">--</span>）</div>
        <div class="data-item">最早记录时段类型：<span id="earliest-type">--</span>（早7点前=夜晚/7点后=白天）</div>
        <div class="data-item">最晚记录时段类型：<span id="latest-type">--</span></div>
      </div>
    </div>
  </div>

  <!-- 新增报告页面的JS -->
  <script src="js/annual-report.js"></script>
</body>
</html>
